<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocol Visualizer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>

<body>
  <header class="site-header">
    <div class="header-brand">
      <a class="brand" href="/">Protocol Visualizer</a>
    </div>
    <div class="header-actions">
      <nav class="header-nav" aria-label="Project links">
        <a class="header-link" href="{{ github_url }}" target="_blank" rel="noreferrer">
          <svg class="header-icon" viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8a8.01 8.01 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
          </svg>
          <span>GitHub</span>
        </a>
        <a class="header-link" href="https://kinjalboro.me" target="_blank" rel="noreferrer">
          <svg class="header-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="6" />
            <path d="M2 8h12M8 2c2 2.5 2.5 6 2.5 6s-.5 3.5-2.5 6c-2-2.5-2.5-6-2.5-6s.5-3.5 2.5-6z" />
          </svg>
          <span>kinjalboro.me</span>
        </a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode"
        title="Switch to light mode"></button>
    </div>
  </header>

  <main class="dashboard">
    <section class="panel activity-panel" aria-labelledby="activity-heading">
      <div class="live-info">
        <span class="live-info-dot"></span>
        <div>
          <strong>
            <h1>Live network activity</h1>
          </strong>
          <p>This dashboard performs real network operations, including HTTPS requests, SMTP email, and streaming.
            Nothing is simulated.</p>
        </div>
      </div>
      <div class="panel-heading">
        <!-- <h1 id="activity-heading">Activity</h1> -->
      </div>

      <div class="activity-tabs" role="tablist" aria-label="Choose an activity">
        <button class="tab is-active" data-activity="browsing" role="tab" aria-selected="true">Browsing</button>
        <button class="tab" data-activity="mail" role="tab" aria-selected="false">Mail</button>
        <button class="tab" data-activity="streaming" role="tab" aria-selected="false">Streaming</button>
      </div>

      <div class="activity-view" data-view="browsing">
        <form id="browse-form">
          <label for="url">URL</label>
          <div class="input-row"><input id="url" name="url" type="url" value="https://example.com" required><button
              class="primary" type="submit">Visit</button></div>
          <!-- <p class="request-note">A live network request runs on the server. The trace shows request details, not raw packets.</p> -->
        </form>
      </div>

      <div class="activity-view is-hidden" data-view="mail">
        <form id="mail-form">
          <label for="to">To</label><input id="to" name="to" type="email" placeholder="recipient@example.com" required>
          <label for="subject">Subject</label><input id="subject" name="subject" type="text"
            placeholder="A protocol message" required>
          <label for="body">Body</label><textarea id="body" name="body" rows="5" placeholder="Write a message"
            required></textarea>
          <button class="primary" type="submit">Send</button>
        </form>
      </div>

      <div class="activity-view is-hidden" data-view="streaming" style="padding-top: 20px;">
        <div class="stream-controls"><button class="primary" id="stream-play" type="button">Play</button><button
            type="button" id="stream-pause">Pause</button></div>
        <video id="stream-player" controls playsinline hidden></video>
      </div>

      <div class="status-block" aria-live="polite"><span class="status-label">Status</span><span
          class="status-dot"></span><span id="status">Ready</span></div>
      <div id="error" class="error" role="alert" hidden></div>
    </section>

    <section class="panel protocol-panel" aria-labelledby="protocol-heading">
      <div class="panel-heading protocol-title">
        <h2 id="protocol-heading">Protocol exchange</h2>
      </div>
      <div id="exchange-view" class="exchange-view" aria-live="polite">
        <p class="empty-state">Run an activity to populate the exchange.</p>
      </div>
      <!-- <p class="trace-note">Live request metadata; no packet capture.</p> -->
    </section>
  </main>
</body>

</html>
